[project]
name = "fhirclient"
requires-python = ">= 3.10"
dependencies = [
    "requests >= 2.4",
]
authors = [{ name="SMART Platforms Team", email="support@smarthealthit.org" }]
readme = "README.md"
keywords = ["smart", "fhir", "healthcare", "medical-informatics", "clinical-informatics", "biomedical-informatics"]
license = { file="LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["description", "version"]

[project.urls]
Homepage = "https://github.com/smart-on-fhir/client-py"
Documentation = "https://docs.smarthealthit.org/client-py/"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = "tests"

[project.optional-dependencies]
async = ["httpx>=0.28,<1", "msgspec>=0.21.1,<0.22"]
smart = ["httpx>=0.28,<1", "msgspec>=0.21.1,<0.22", "pyjwt[crypto]>=2.11,<3"]
tests = [
    "pytest >= 2.5",
    "pytest-cov",
    "responses",
]

[tool.basedpyright]
include = ["fhirclient/async_client.py", "fhirclient/smart.py", "fhirclient/_smart_types.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportExplicitAny = "error"
reportUnnecessaryTypeIgnoreComment = "error"
enableTypeIgnoreComments = false

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D2", "D3", "D4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = ["ruff==0.15.22", "basedpyright==1.39.9", "build==1.4.0"]
